name: CI

on:
  push:
  pull_request:

jobs:
  kernel:
    name: Kernel + tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows: OSP's library target needs SQLite3 (vcpkg) at configure time; added once that is set up.
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true          # external/osp and external/analog (not recursive)
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsqlite3-dev
      - name: macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Performance matrix (quick)
        run: ./build/tools/modular-bench --quick

  plugin:
    name: Plugin + product tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsqlite3-dev libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMODULAR_BUILD_PLUGIN=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Product tests + screenshots (Linux, virtual display)
        if: runner.os == 'Linux'
        run: MODULAR_SCREENSHOT_DIR=screens xvfb-run -a -s "-screen 0 1920x1200x24" ./build/product/modular_product_tests
      - name: Product tests + screenshots (macOS)
        if: runner.os == 'macOS'
        run: MODULAR_SCREENSHOT_DIR=screens ./build/product/modular_product_tests
      - name: auval
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/product/ANDOR_Modular_artefacts/Release/AU/ANDOR Modular.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Amdr Ospx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens-${{ matrix.os }}
          path: screens
